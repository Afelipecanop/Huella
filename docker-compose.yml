services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: huella
      POSTGRES_PASSWORD: huella
      POSTGRES_DB: huella
    ports:
      - "5432:5432"
    volumes:
      - huella_postgres_data:/var/lib/postgresql/data

volumes:
  huella_postgres_data:
